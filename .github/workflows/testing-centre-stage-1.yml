name: Testing Centre Stages 1 to 6A

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Stage 1 to 6A Python tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Stage 1 to 6A test dependencies
        run: python -m pip install "fastapi==0.110.1" "starlette==0.37.2" "httpx==0.28.1" "pydantic==2.12.5" "pytest==9.0.3" "playwright==1.58.0" "bcrypt==4.1.3" "PyJWT==2.12.1" "pymongo==4.5.0" "motor==3.3.1" "dnspython==2.8.0"
      - name: Python syntax checks
        run: python -m compileall -q backend/testing_centre backend/server.py tests/test_testing_centre.py tests/test_testing_centre_browser.py tests/test_testing_centre_security.py tests/test_testing_centre_agents.py tests/test_testing_centre_repairs.py tests/test_testing_centre_github_drafts.py tests/test_testing_centre_workspaces.py tests/test_testing_centre_worker.py tests/test_testing_centre_mongo_integration.py tests/test_testing_centre_playwright_smoke.py scripts/stage5_staging_smoke.py scripts/stage6a_staging_smoke.py scripts/stage6a_legacy_security_smoke.py tests/test_legacy_operator_security.py
      - name: Run Testing Centre regression tests (mocked network)
        run: python -m pytest -q tests/test_testing_centre.py tests/test_testing_centre_browser.py tests/test_testing_centre_security.py tests/test_testing_centre_agents.py tests/test_testing_centre_repairs.py tests/test_testing_centre_github_drafts.py tests/test_testing_centre_workspaces.py tests/test_testing_centre_worker.py

      - name: Legacy agent HTTP/WS authorization and credential fallback checks
        run: python -m pytest -q tests/test_legacy_operator_security.py

      - name: Real MongoDB tenant-isolation and queue integration (mock network)
        env:
          TESTING_INTEGRATION_MONGO_URI: mongodb://localhost:27017
        run: python -m pytest -q tests/test_testing_centre_mongo_integration.py

      - name: Install Chromium for offline browser smoke
        run: python -m playwright install --with-deps chromium
      - name: Run offline real Chromium smoke test
        run: python -m pytest -q tests/test_testing_centre_playwright_smoke.py

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install existing frontend dependencies (baseline lockfiles are out of sync)
        run: npm install --legacy-peer-deps --no-audit --no-fund --prefix frontend
      - name: Verify secured frontend API and WebSocket routing
        run: cd frontend && CI=true npm test -- --watchAll=false --runInBand --testPathPattern=apiRouting.test.js
      - name: Build full existing React application
        run: cd frontend && CI=false npm run build
      - name: Ensure no obsolete Render endpoint in production JavaScript
        run: |
          if grep -rlF "rasalilabs.onrender.com" frontend/build/static/js; then
            echo "Blocked: bundle still includes obsolete Render host"
            exit 1
          fi
          grep -rlF "rasalilabs-api-staging.onrender.com" frontend/build/static/js > /dev/null
